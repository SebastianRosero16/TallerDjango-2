<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Solicitud</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 16px; }
        .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 48px; width: 100%; max-width: 680px; }
        h1 { color: #667eea; margin-bottom: 12px; font-size: 2rem; font-weight: 700; text-align: center; }
        p.subtitle { color: #6c757d; margin-bottom: 32px; font-size: 1rem; text-align: center; }
        .form-group { margin-bottom: 24px; }
        label { display: block; font-weight: 600; color: #495057; margin-bottom: 8px; font-size: 0.95rem; }
        .form-control { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; transition: all 0.3s; }
        .form-control:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .errorlist { color: #dc3545; font-size: 0.875rem; margin-top: 6px; list-style: none; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; padding: 14px 32px; border-radius: 8px; font-size: 1.05rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 12px; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Formulario de Solicitud</h1>
        <p class="subtitle">Complete todos los campos requeridos para registrar su solicitud.</p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <ul class="errorlist">
                        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
                    </ul>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn">Enviar Solicitud</button>
        </form>
    </div>
</body>
</html>
