<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Solicitud</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px 16px; }
        .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 36px; width: 100%; max-width: 620px; }
        h1 { color: #2c3e50; margin-bottom: 8px; font-size: 1.6rem; }
        p.subtitle { color: #7f8c8d; margin-bottom: 28px; font-size: 0.95rem; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; color: #34495e; margin-bottom: 6px; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; transition: border 0.2s; }
        .form-control:focus { outline: none; border-color: #3498db; }
        .errorlist { color: #e74c3c; font-size: 0.85rem; margin-top: 4px; list-style: none; }
        .btn { background: #3498db; color: #fff; border: none; padding: 12px 28px; border-radius: 6px; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Formulario de Solicitud</h1>
        <p class="subtitle">Complete todos los campos requeridos para registrar su solicitud.</p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <ul class="errorlist">
                        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
                    </ul>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn">Enviar Solicitud</button>
        </form>
    </div>
</body>
</html>
