<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Enviada</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 48px 36px; text-align: center; max-width: 480px; width: 100%; }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        h1 { color: #27ae60; margin-bottom: 12px; font-size: 1.8rem; }
        p { color: #7f8c8d; margin-bottom: 28px; font-size: 1rem; line-height: 1.6; }
        .btn { display: inline-block; background: #3498db; color: #fff; text-decoration: none; padding: 12px 28px; border-radius: 6px; font-size: 1rem; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>¡Solicitud Enviada!</h1>
        <p>Tu solicitud ha sido registrada exitosamente en el sistema. Nos pondremos en contacto contigo pronto.</p>
        <a href="{% url 'solicitudes:formulario' %}" class="btn">Nueva Solicitud</a>
    </div>
</body>
</html>
