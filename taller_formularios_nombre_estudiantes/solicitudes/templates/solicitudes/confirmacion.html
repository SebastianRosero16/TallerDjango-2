<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Enviada</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 56px 40px; text-align: center; max-width: 520px; width: 100%; }
        .icon { font-size: 5rem; margin-bottom: 20px; animation: bounce 0.6s ease; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h1 { color: #10b981; margin-bottom: 16px; font-size: 2rem; font-weight: 700; }
        p { color: #6c757d; margin-bottom: 32px; font-size: 1.05rem; line-height: 1.7; }
        .btn { display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-size: 1.05rem; font-weight: 600; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>¡Solicitud Enviada!</h1>
        <p>Tu solicitud ha sido registrada exitosamente en el sistema. Nos pondremos en contacto contigo pronto.</p>
        <a href="{% url 'solicitudes:formulario' %}" class="btn">Nueva Solicitud</a>
    </div>
</body>
</html>
